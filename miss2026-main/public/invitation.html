<style>
body{font:17px system-ui,sans-serif;background:#0a1533;color:#fff;text-align:center;margin:0;padding:24px}
main{max-width:600px;margin:5vh auto}
img{display:block;width:100%;height:auto;border-radius:14px}
a{display:block;padding:16px;margin-top:20px;border-radius:12px;background:#006f42;color:#fff;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<main><img src="/images/invitation-link-preview-v1.png" alt="Invitation à la soirée Miss France 2027">
<p id="message">Ouverture de ton invitation…</p>
<a id="open" href="/#/login">Ouvrir le site</a>
<noscript>Active JavaScript pour accéder à ton invitation personnalisée.</noscript>
</main>
<script>
(function(){
 const token=new URLSearchParams(location.search).get("invite");
 if(!token||!/^[a-f0-9]{64}$/.test(token)){
  document.getElementById("message").textContent="Lien d’invitation invalide ou incomplet.";
  return;
 }
 const target="/#/login?invite="+token;
 const button=document.getElementById("open");
 button.href=target;
 button.textContent="JE REJOINS MES AMIS";
 // The crawler reads the static metadata; an actual browser opens the existing group flow.
 location.replace(target);
})();
</script>
